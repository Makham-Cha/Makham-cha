<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#789a63">
  <meta name="description" content="MAKHAM CHA - เมนูมัทฉะและระบบสั่งซื้อ">
  <title>Makham CHA — Matcha Menu & Order</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="hero">
      <div class="brand">Makham <span>CHA</span></div>
      <div class="subtitle">Matcha Made with Love</div>
      <div class="hero-note">เลือกสินค้า • ระบุข้อมูล • ส่งออเดอร์ทาง LINE OA</div>
    </header>
    <section id="product" class="product-card" aria-live="polite"></section>
    <section class="menu-section">
      <div class="section-title">เมนูมัทฉะ</div>
      <div id="menu" class="menu-grid"></div>
    </section>
    <section id="order" class="order-section">
      <div class="section-title">ข้อมูลสำหรับจัดส่ง</div>
      <div class="order-card">
        <div class="form-grid">
          <label>ชื่อเล่น <span>*</span><input id="nickname" type="text" maxlength="50" placeholder="เช่น นนท์" autocomplete="name"></label>
          <label>เบอร์ติดต่อ <span>*</span><input id="phone" type="tel" maxlength="20" placeholder="08x-xxx-xxxx" autocomplete="tel"></label>
        </div>
        <div class="location-box">
          <div><strong>📍 ตำแหน่งจัดส่ง</strong><div id="locationStatus" class="location-status">ยังไม่ได้ระบุตำแหน่ง</div></div>
          <button id="locationBtn" class="location-btn" type="button" onclick="getCustomerLocation()">แท็กโลเคชั่น</button>
        </div>
        <div id="cart" class="cart"></div>
        <div class="total-row"><span>ยอดรวมทั้งหมด</span><strong id="grandTotal">฿0</strong></div>
        <button class="order-btn" type="button" onclick="submitOrder()">ส่งออเดอร์ทาง LINE OA</button>
        <button class="copy-btn" type="button" onclick="copyOrderText()">คัดลอกข้อความออเดอร์</button>
        <div class="privacy-note">ระบบจะใช้ชื่อเล่น เบอร์ติดต่อ และตำแหน่งที่คุณกดยืนยันเพื่อจัดการออเดอร์นี้</div>
      </div>
    </section>
    <footer><div>MAKHAM CHA</div><div>Matcha Made with Love</div></footer>
  </main>
  <script src="app.js"></script>
</body>
</html>
