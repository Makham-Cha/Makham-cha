<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#789a63">
<title>ชำระเงิน • Makham CHA</title>
<style>
:root{--green:#789a63;--deep:#355c45;--cream:#fffdf6;--line:#dfe7d8}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:linear-gradient(180deg,#f3f7ee,#fffdf6);color:#355c45}
.app{max-width:560px;margin:auto;padding:18px 16px 34px}
.card{background:#fff;border:1px solid var(--line);border-radius:24px;box-shadow:0 12px 30px rgba(53,92,69,.10);padding:20px;margin-bottom:14px}
.brand{text-align:center;font-weight:800;font-size:24px;letter-spacing:.04em}
.sub{text-align:center;color:#777;font-size:13px;margin-top:3px}
.status{text-align:center;padding:12px;border-radius:14px;background:#f4f7ef;color:#666;margin:14px 0}
.amount{text-align:center;font-size:30px;font-weight:900;color:var(--green);margin:8px 0 14px}
.order{text-align:center;font-size:13px;color:#777}
.qr{display:block;width:min(82vw,330px);height:auto;margin:10px auto 4px;border-radius:16px}
.section-title{font-weight:800;font-size:17px;margin-bottom:8px}
.note{font-size:13px;color:#777;line-height:1.55}
.file-label{display:flex;align-items:center;justify-content:center;min-height:58px;border:2px dashed #b8c9aa;border-radius:16px;background:#f8faf5;font-weight:800;cursor:pointer}
.file-label input{display:none}
.preview{display:none;width:100%;max-height:430px;object-fit:contain;border-radius:16px;margin-top:12px;background:#f4f4f4}
.submit{width:100%;border:0;border-radius:16px;padding:15px;background:var(--green);color:white;font-size:16px;font-weight:800;cursor:pointer;margin-top:14px}
.submit:disabled{opacity:.45;cursor:not-allowed}
.error{display:none;color:#a33;background:#fff1f1;border:1px solid #f1caca;border-radius:14px;padding:12px;font-size:13px;line-height:1.5;margin-top:12px}
.success{display:none;text-align:center;padding:28px 10px}
.success .icon{font-size:48px}.success h2{margin:8px 0;color:var(--deep)}
.small{text-align:center;color:#999;font-size:11px;margin-top:14px}
</style>
</head>
<body>
<main class="app">
<div class="card">
  <div class="brand">🍵 MAKHAM CHA</div>
  <div class="sub">ชำระเงินและส่งสลิป</div>
  <div id="loading" class="status">กำลังโหลดข้อมูลออเดอร์...</div>
  <div id="paymentInfo" style="display:none">
    <div id="customer" class="order"></div>
    <div id="amount" class="amount">฿0</div>
    <div id="orderId" class="order"></div>
    <img id="qr" class="qr" alt="PromptPay QR">
    <div class="note" style="text-align:center">สแกน QR เพื่อชำระเงินตามยอดด้านบน</div>
  </div>
</div>
<div id="uploadCard" class="card" style="display:none">
  <div class="section-title">📎 แนบสลิปการโอนเงิน</div>
  <div class="note">เลือกภาพสลิปจากเครื่องก่อน จึงจะกดส่งได้ ระบบจะย่อภาพให้เหมาะสมก่อนบันทึก</div>
  <label class="file-label" for="slipFile" style="margin-top:12px">เลือกไฟล์สลิป
    <input id="slipFile" type="file" accept="image/jpeg,image/png,image/webp">
  </label>
  <img id="preview" class="preview" alt="ตัวอย่างสลิป">
  <button id="submitBtn" class="submit" type="button" disabled>ยืนยันและส่งสลิป</button>
  <div id="error" class="error"></div>
</div>
<div id="successCard" class="card success">
  <div class="icon">✅</div>
  <h2>ส่งสลิปเรียบร้อยแล้ว</h2>
  <div>Order <strong id="successOrder"></strong></div>
  <div class="note" style="margin-top:8px">ทางร้านได้รับสลิปแล้ว และจะตรวจสอบยอดให้ครับ 💚</div>
</div>
<div class="small">ส่งสลิปได้ 1 ครั้งต่อออเดอร์</div>
</main>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const CONFIG={
  LIFF_ID:"2011672004-mTPUoEBy",
  BACKEND_URL:"https://script.google.com/macros/s/AKfycbwC8RY2g03Koji_Bq8Lz4o4iMvE6U2-xNSwMn4qfhZ_vHBXOnW1FlcCVBJZro6e0KzjJA/exec"
};
let orderId="",paymentKey="",imageData="",submitted=false;
const $=id=>document.getElementById(id);
function showError(msg){$("error").textContent=msg;$("error").style.display="block"}
function hideError(){$("error").style.display="none"}
function jsonp(url){
  return new Promise((resolve,reject)=>{
    const cb="makhamPayment_"+Date.now()+"_"+Math.random().toString(36).slice(2);
    const script=document.createElement("script");
    const timer=setTimeout(()=>{cleanup();reject(new Error("โหลดข้อมูลออเดอร์ไม่สำเร็จ"))},15000);
    function cleanup(){clearTimeout(timer);script.remove();delete window[cb]}
    window[cb]=data=>{cleanup();resolve(data)};
    script.onerror=()=>{cleanup();reject(new Error("เชื่อมต่อระบบชำระเงินไม่ได้"))};
    script.src=url+"&callback="+cb;
    document.head.appendChild(script);
  });
}
async function init(){
  try{
    await liff.init({liffId:CONFIG.LIFF_ID});
    const params=new URLSearchParams(location.search);
    orderId=params.get("orderId")||"";
    paymentKey=params.get("key")||"";
    if(!orderId||!paymentKey)throw new Error("ไม่พบข้อมูลออเดอร์ในลิงก์");
    const data=await jsonp(CONFIG.BACKEND_URL+"?action=payment&orderId="+encodeURIComponent(orderId)+"&key="+encodeURIComponent(paymentKey));
    if(!data.ok)throw new Error(data.error||"ไม่พบข้อมูลออเดอร์");
    $("loading").style.display="none";
    $("paymentInfo").style.display="block";
    $("customer").textContent="คุณ "+(data.nickname||"ลูกค้า LINE");
    $("amount").textContent="฿"+Number(data.total).toLocaleString("th-TH");
    $("orderId").textContent="Order: "+data.orderId;
    if(data.qrUrl){$("qr").src=data.qrUrl}else throw new Error("ไม่สามารถสร้าง QR ชำระเงินได้");
    if(data.paid){showAlreadyPaid(data.orderId);return}
    $("uploadCard").style.display="block";
  }catch(err){
    $("loading").textContent=err.message||"เกิดข้อผิดพลาด";
    $("loading").style.background="#fff1f1";$("loading").style.color="#a33";
  }
}
function showAlreadyPaid(id){
  $("uploadCard").style.display="none";
  $("successCard").style.display="block";
  $("successOrder").textContent=id;
}
function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=()=>{
      const img=new Image();
      img.onload=()=>{
        const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height));
        const canvas=document.createElement("canvas");
        canvas.width=Math.max(1,Math.round(img.width*scale));
        canvas.height=Math.max(1,Math.round(img.height*scale));
        const ctx=canvas.getContext("2d");
        ctx.fillStyle="#fff";ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img,0,0,canvas.width,canvas.height);
        resolve(canvas.toDataURL("image/jpeg",.78));
      };
      img.onerror=()=>reject(new Error("ไม่สามารถอ่านรูปสลิปนี้ได้ กรุณาใช้ JPG หรือ PNG"));
      img.src=reader.result;
    };
    reader.onerror=()=>reject(new Error("อ่านไฟล์สลิปไม่สำเร็จ"));
    reader.readAsDataURL(file);
  });
}
$("slipFile").addEventListener("change",async e=>{
  hideError();const file=e.target.files&&e.target.files[0];
  if(!file){imageData="";$("preview").style.display="none";$("submitBtn").disabled=true;return}
  if(file.size>12*1024*1024){showError("ไฟล์ต้นฉบับใหญ่เกิน 12 MB กรุณาเลือกภาพที่เล็กลง");e.target.value="";return}
  try{
    $("submitBtn").disabled=true;
    imageData=await compressImage(file);
    $("preview").src=imageData;$("preview").style.display="block";
    $("submitBtn").disabled=false;
  }catch(err){imageData="";$("submitBtn").disabled=true;showError(err.message)}
});
window.addEventListener("message",e=>{
  const d=e.data||{};
  if(d.source!=="makham-cha-payment"||submitted)return;
  submitted=true;
  if(d.ok){
    $("uploadCard").style.display="none";$("successCard").style.display="block";$("successOrder").textContent=d.orderId||orderId;
    setTimeout(()=>{try{if(liff.isInClient())liff.closeWindow()}catch(err){}},1800);
  }else{
    submitted=false;$("submitBtn").disabled=false;showError(d.error||"ระบบบันทึกสลิปไม่สำเร็จ กรุณาลองใหม่");
  }
});
$("submitBtn").addEventListener("click",()=>{
  if(submitted||!imageData||!orderId||!paymentKey)return;
  hideError();submitted=true;$("submitBtn").disabled=true;$("submitBtn").textContent="กำลังส่งสลิป...";
  const iframeName="makhamSlipFrame_"+Date.now();
  const iframe=document.createElement("iframe");iframe.name=iframeName;iframe.style.display="none";document.body.appendChild(iframe);
  const form=document.createElement("form");
  form.method="POST";form.action=CONFIG.BACKEND_URL;form.target=iframeName;form.style.display="none";
  const input=document.createElement("input");input.type="hidden";input.name="slipPayload";
  input.value=JSON.stringify({orderId,key:paymentKey,imageData});
  form.appendChild(input);document.body.appendChild(form);
  form.submit();
  setTimeout(()=>{
    if(submitted){
      submitted=false;$("submitBtn").disabled=false;$("submitBtn").textContent="ยืนยันและส่งสลิป";
      showError("ระบบใช้เวลานานกว่าปกติ กรุณาตรวจสอบอีกครั้งก่อนส่งซ้ำ");
    }
    setTimeout(()=>{form.remove();iframe.remove()},1000);
  },20000);
});
init();
</script>
</body>
</html>
